# this configuration file has all empty components set up.
# use 'esphome compile test_empty_components.yaml' to build.

packages:
  device: !include device.yaml  # include our test device setup

i2c:
  sda: 22
  scl: 23
  scan: True
  id: bus_a
  frequency: 50kHz

bq21088:
  i2c_id: bus_a
  id: bq_test
  int_pin:
    number: 25
    mode:
      pullup: true
      input: true

switch:
  - platform: bq21088
    bq21088_id: bq_test
    charge_disable:
      name: Laden deaktivieren
    reduce_precharge:
      name: Precharge Voltage 2.8V

number:
  - platform: bq21088
    bq21088_id: bq_test
    vbat:
      name: Battery Endladespannung
    icgh:
      name: Battery Ladestrom
    buvlo:
      name: Battery Undervoltage Lockout

sensor:
  - platform: bq21088
    bq21088_id: bq_test
    charge_status:
      name: Ladezustand

binary_sensor:
  - platform: bq21088
    bq21088_id: bq_test
    vin_pwr_good:
      name: VIN Power good
    batt_ocp_fault:
      name: "Battery Overcurrent Protection"
    batt_uvlo_fault:
      name: "Battery Undervoltage Protection"
